name: tests

# Validates the formula the same way it was validated by hand: style, an online
# strict audit, and a real install + test + uninstall on every platform the formula
# targets: arm64 macOS, Intel macOS, and x86_64 Linux. The test runs without the
# Verus rustup toolchain (the launcher self-reports it), so CI stays fast and green.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel, ubuntu-latest] # arm64 macOS, Intel macOS, x86_64 Linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out tap
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: tap

      - name: Set up Homebrew
        # Pinned to a commit SHA, not @master: an unpinned ref is a moving target that can
        # change between runs of an unchanged formula and is the classic supply-chain vector.
        # setup-homebrew ships no semver tags, so this tracks Homebrew/actions master as of
        # 2026-05-29; Dependabot bumps it on a schedule (.github/dependabot.yml).
        uses: Homebrew/actions/setup-homebrew@521d40582eb7b2dc6c83001c590c455100248f27 # master@2026-05-29

      - name: Register the local checkout as a tap
        id: tap
        run: |
          owner="$(echo "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')"
          dest="$(brew --repository)/Library/Taps/${owner}/homebrew-verus"
          mkdir -p "$(dirname "$dest")"
          ln -s "${GITHUB_WORKSPACE}/tap" "$dest"
          echo "name=${owner}/verus/verus" >> "$GITHUB_OUTPUT"

      - name: Style + strict online audit
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          brew style "${{ steps.tap.outputs.name }}"
          brew audit --strict --online "${{ steps.tap.outputs.name }}"

      - name: Install + test + uninstall
        run: |
          # --formula is intentionally omitted: `brew test` does not accept it (only
          # install/uninstall do), and the fully-qualified tap name needs no cask
          # disambiguation. Keep all three consistent so the test line is not "fixed" back.
          brew install "${{ steps.tap.outputs.name }}"
          brew test "${{ steps.tap.outputs.name }}"
          brew uninstall "${{ steps.tap.outputs.name }}"

  ci-passed:
    # One stable check for branch protection to require, instead of naming each matrix leg
    # (test (macos-14), test (macos-15-intel), ...); those names change whenever the matrix is
    # edited, silently dropping the required check. This job needs the whole matrix and, via
    # `if: always()`, runs even when a leg fails so it can turn that into a single red/green.
    name: ci-passed
    if: ${{ always() }}
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate matrix result
        env:
          RESULT: ${{ needs.test.result }}
        run: |
          echo "test matrix result: ${RESULT}"
          if [ "${RESULT}" != "success" ]; then
            echo "::error::The test matrix did not succeed (result: ${RESULT})."
            exit 1
          fi
